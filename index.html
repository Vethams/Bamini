<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tamil Bamini ⇄ Unicode Converter</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#0f172a;
color:white;
transition:.3s;
}

body.light{
background:#f2f2f2;
color:#111;
}

.container{

max-width:1200px;
margin:auto;
padding:30px;

}

header{

display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:25px;

}

h1{

font-size:32px;

}

.card{

background:rgba(255,255,255,.07);
backdrop-filter:blur(12px);
padding:20px;
border-radius:20px;
margin-bottom:20px;

}

body.light .card{

background:white;

}

textarea{

width:100%;
height:250px;
padding:15px;
font-size:18px;
border:none;
outline:none;
border-radius:15px;
resize:none;

}

.buttons{

display:flex;
gap:10px;
flex-wrap:wrap;
margin-top:15px;

}

button{

padding:12px 20px;
border:none;
border-radius:12px;
cursor:pointer;
font-size:16px;
font-weight:bold;

}

.convert{

background:#2563eb;
color:white;

}

.copy{

background:#10b981;
color:white;

}

.clear{

background:#ef4444;
color:white;

}

.download{

background:#7c3aed;
color:white;

}

.stats{

display:flex;
gap:20px;
margin-top:15px;
font-size:15px;

}

.switch{

cursor:pointer;
padding:10px 20px;
border-radius:15px;
background:#111827;

}

body.light .switch{

background:#ddd;

}

footer{

text-align:center;
margin-top:40px;
opacity:.6;

}

</style>
</head>
<body>

<div class="container">

<header>

<h1>Tamil Converter</h1>

<div class="switch" onclick="toggleTheme()">

🌙 Theme

</div>

</header>

<div class="card">

<h2>Bamini Text</h2>

<textarea id="input" placeholder="Paste Bamini text here..." oninput="updateStats()"></textarea>

<div class="buttons">

<button class="convert" onclick="toUnicode()">Bamini ➜ Unicode</button>

<button class="convert" onclick="toBamini()">Unicode ➜ Bamini</button>

<button class="copy" onclick="copyText()">Copy</button>

<button class="clear" onclick="clearAll()">Clear</button>

<button class="download" onclick="downloadTxt()">Download</button>

</div>

<div class="stats">

<div>Characters :
<span id="charCount">0</span></div>

<div>Words :
<span id="wordCount">0</span></div>

</div>

</div>

<div class="card">

<h2>Output</h2>

<textarea id="output"></textarea>

</div>

<footer>

Demo Version • Limited Mapping

</footer>

</div>

<script>

const baminiToUnicode={

"m":"அ",
"M":"ஆ",
"," :"இ",
"<":"ஈ",
"c":"உ",
"C":"ஊ",
"v":"எ",
"V":"ஏ",
"I":"ஐ",
"x":"ஒ",
"X":"ஓ",
"s":"க",
"h":"ங",
"j":"ச",
"e":"ஞ",
"f":"ட",
"F":"ண",
"g":"த",
"G":"ந",
"k":"ப",
"K":"ம",
"l":"ய",
"o":"ர",
"p":"ல",
"P":"வ",
"y":"ழ",
"u":"ள",
"i":"ற",
"O":"ன"

};

const unicodeToBamini={};

for(let key in baminiToUnicode){

unicodeToBamini[baminiToUnicode[key]]=key;

}

function convert(text,map){

let result="";

for(let ch of text){

result+=map[ch]||ch;

}

return result;

}

function toUnicode(){

let text=document.getElementById("input").value;

document.getElementById("output").value=convert(text,baminiToUnicode);

}

function toBamini(){

let text=document.getElementById("input").value;

document.getElementById("output").value=convert(text,unicodeToBamini);

}

function copyText(){

navigator.clipboard.writeText(document.getElementById("output").value);

alert("Copied");

}

function clearAll(){

input.value="";
output.value="";
updateStats();

}

function downloadTxt(){

let text=output.value;

let blob=new Blob([text],{type:"text/plain"});

let a=document.createElement("a");

a.href=URL.createObjectURL(blob);

a.download="Tamil.txt";

a.click();

}

function updateStats(){

let t=input.value;

charCount.innerText=t.length;

wordCount.innerText=t.trim()==""?0:t.trim().split(/\s+/).length;

}

function toggleTheme(){

document.body.classList.toggle("light");

}

</script>

</body>
</html>
